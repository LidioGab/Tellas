# fly.toml app configuration file generated for tellas on 2026-08-26T01:42:21Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tellas'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
